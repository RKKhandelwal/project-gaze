app = "gaze-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  GAZE_DB_PATH = "/data/gaze.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "gaze_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
